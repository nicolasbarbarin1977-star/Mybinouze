name: Build AAB
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-aab.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Check website (info only)
        continue-on-error: true
        run: |
          for u in "" index.html manifest.json icon-192.png sw.js .well-known/assetlinks.json; do echo "$(curl -s -o /dev/null -w '%{http_code}' https://stirring-belekoy-b817ed.netlify.app/$u) /$u"; done
          curl -s https://stirring-belekoy-b817ed.netlify.app/ | head -c 600
      - run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: my-binouze-aab-unsigned, path: android/app/build/outputs/bundle/release/*.aab }
      - name: Publish unsigned bundle to build-output branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/bundle/release/*.aab /tmp/out/my-binouze-unsigned.aab
          cd /tmp/out && git init -q && git checkout -q -b build-output
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "Bundle ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
