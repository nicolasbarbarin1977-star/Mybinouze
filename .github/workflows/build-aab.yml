name: Build AAB
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-aab.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Icons from the website
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable
          curl -fsSL https://cozy-jalebi-02ca19.netlify.app/icon-192.png -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          curl -fsSL https://cozy-jalebi-02ca19.netlify.app/icon-512.png -o app/src/main/res/drawable/splash.png
      - run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: my-binouze-aab-unsigned, path: android/app/build/outputs/bundle/release/*.aab }
